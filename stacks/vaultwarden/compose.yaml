services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      DOMAIN: "https://vaultwarden.home.arpa"
      SIGNUPS_ALLOWED: "true"
      ADMIN_TOKEN: "${ADMIN_TOKEN}"
      WEBSOCKET_ENABLED: "true"
    volumes:
      - ./vw-data:/data
    networks:
      - caddy_net

volumes:
  vw-data:

networks:
  caddy_net:
    external: true
